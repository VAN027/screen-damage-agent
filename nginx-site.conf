server {
    listen 80;
    listen [::]:80;
    # 部署前替换为证书对应的真实域名。
    server_name screen-damage.example.com;

    return 308 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # 部署前替换为证书对应的真实域名。
    server_name screen-damage.example.com;

    # 生产证书由运维系统或 ACME 客户端写入该只读目录；没有证书时 Nginx 应拒绝启动。
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:screen_damage_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # 默认接口只接收小 JSON；图片/LLM/管理上传在各 location 单独放宽。
    client_max_body_size 64k;
    client_body_timeout 30s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 普通判定是 KB 级 JSON。
    location = /api/v1/cases/decide {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8080;
    }

    # 单图向量请求：应用层 9MB 上限。关闭请求体预缓冲，避免 Nginx 先落盘整份图片；
    # Nginx 与应用仍分别校验总大小，client_body_timeout 限制慢速上传。
    location ~ ^/api/(?:v1/cases/search-similar|knowledge/search-vector)$ {
        client_max_body_size 9m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/knowledge/correction {
        client_max_body_size 4m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }

    # 用户启动鉴定时保存压缩水印图和表单；后续 PATCH 只更新结构化结果。
    location = /api/knowledge/assessment-records {
        client_max_body_size 22m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }

    # 多图 LLM 请求：有效 data URL 总计 20MB，连同 JSON 开销上限为 22MB。
    location ~ ^/api/knowledge/analyze-llm(?:-stream)?$ {
        client_max_body_size 22m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 150s;
    }

    location ~ ^/api/knowledge/feedback(?:/report|/confirm)?$ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8080;
    }

    # H5 只读公开接口必须经过 BFF。其余 Knowledge 管理接口由 admin 代理并校验管理员令牌。
    location ~ ^/api/knowledge/(?:public-config|cases/result-stats|field-defs|images)$ {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
    }

    # 管理后台页面
    location /admin {
        proxy_pass http://127.0.0.1:8082;
    }

    # 管理后台 API
    location /api/admin/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8082;
    }

    # Knowledge API（通过 decision-admin 代理到 knowledge-ai:8083）
    location /api/knowledge/ {
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8082;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # H5 前端 + 主 API 网关
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
